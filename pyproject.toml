[project]
name = "ai-operations-assistant"
version = "0.1.0"
description = "Prototype of a controlled-retrieval operations chatbot with claim-to-record validation (synthetic data)"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]
app = ["streamlit"]

# pytest finds the package (src) and the eval helpers (eval) without installing
[tool.pytest.ini_options]
pythonpath = ["src", "eval"]
testpaths = ["tests"]
